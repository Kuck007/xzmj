name: Sync Release to Gitee

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to sync (e.g. 1.6.1-25)'
        required: true

jobs:
  sync-release:
    runs-on: ubuntu-latest
    steps:
      - name: Get release info
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.payload.release?.tag_name || context.payload.inputs?.tag;
            if (!tag) {
              core.setFailed('No tag found in release event or workflow_dispatch input');
              return;
            }
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 50
            });
            const release = releases.data.find(r => r.tag_name === tag);
            if (!release) {
              core.setFailed(`Release with tag ${tag} not found`);
              return;
            }
            core.setOutput('tag', tag);
            core.setOutput('name', release.name);
            core.setOutput('body', release.body || '');
            console.log('Found release:', release.name);

      - name: Create Gitee Release
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          NAME="${{ steps.release.outputs.name }}"
          BODY_FILE=$(mktemp)
          echo '${{ steps.release.outputs.body }}' > "$BODY_FILE"
          
          echo "Creating Gitee release: $TAG"
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://gitee.com/api/v5/repos/kuck007/xzmj/releases?access_token=${{ secrets.GITEE_XZMJ_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"tag_name\": \"${TAG}\",
              \"name\": \"${NAME}\",
              \"body\": $(jq -Rs . < "$BODY_FILE"),
              \"prerelease\": false,
              \"target_commitish\": \"main\"
            }")
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY_RESP=$(echo "$RESPONSE" | sed '$d')
          echo "HTTP_CODE=$HTTP_CODE"
          
          if [ "$HTTP_CODE" = "201" ] || [ "$HTTP_CODE" = "200" ]; then
            echo "Gitee Release created successfully"
            echo "$BODY_RESP" | jq -r '.html_url' 2>/dev/null || true
          else
            echo "Create failed (HTTP $HTTP_CODE), release may already exist"
            echo "$BODY_RESP"
          fi
          
          rm -f "$BODY_FILE"
