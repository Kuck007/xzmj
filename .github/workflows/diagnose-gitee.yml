name: Diagnose Gitee Upload

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: 0. Gitee 连通性（时间分解）
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_XZMJ_TOKEN }}
        run: |
          echo "=== gitee.com 各阶段耗时 ==="
          curl -sI -o /dev/null \
            -w "dns=%{time_namelookup}s connect=%{time_connect}s tls=%{time_appconnect}s ttfb=%{time_starttransfer}s http=%{http_code}\n" \
            --max-time 30 https://gitee.com
          echo "=== api.gitee / release 接口可达性 ==="
          curl -s -o /dev/null -w "releases api http=%{http_code} total=%{time_total}s\n" --max-time 30 \
            "https://gitee.com/api/v5/repos/kuck007/xzmj/releases?per_page=1&access_token=${GITEE_TOKEN}"

      - name: 1. 小文件 1KB 上传（验证 API 字段/认证，禁用 Expect 头）
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_XZMJ_TOKEN }}
        run: |
          API="https://gitee.com/api/v5/repos/kuck007/xzmj/releases/1156342/attach_files"
          head -c 1024 /dev/urandom > /tmp/test1k.bin
          echo "=== 上传 1KB（-H 'Expect:'，max-time 60）==="
          curl -s -X POST "$API" -H "Expect:" --connect-timeout 30 --max-time 60 \
            -F "access_token=${GITEE_TOKEN}" -F "file=@/tmp/test1k.bin" \
            -w "\nHTTP=%{http_code} total=%{time_total}s upload_speed=%{speed_upload}B/s\n" | head -c 800
          echo

      - name: 2. 下载 11MB 安装包（GitHub 速度基准）
        run: |
          echo "=== 从 GitHub 下载 ==="
          curl -fsSL --connect-timeout 30 --max-time 120 \
            -w "\n下载耗时 total=%{time_total}s 速度=%{speed_download}B/s\n" \
            -o /tmp/big.zip \
            "https://github.com/Kuck007/xzmj/releases/download/1.7.4-36/xzmj-mac-arm-1.7.4.zip"
          ls -lh /tmp/big.zip

      - name: 3. 大文件 11MB 上传到 Gitee（禁用 Expect + 超时 240s + 进度）
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_XZMJ_TOKEN }}
        run: |
          API="https://gitee.com/api/v5/repos/kuck007/xzmj/releases/1156342/attach_files"
          echo "=== 上传 11MB（-H 'Expect:'，--max-time 240，显示进度）==="
          set -o pipefail
          START=$(date +%s)
          HTTP_CODE=$(curl -s -X POST "$API" \
            -H "Expect:" \
            --connect-timeout 30 --max-time 240 \
            -F "access_token=${GITEE_TOKEN}" \
            -F "file=@/tmp/big.zip" \
            -w "\nHTTP_CODE=%{http_code} 上传耗时=%{time_total}s 上传速度=%{speed_upload}B/s\n" \
            -o /tmp/up_resp.txt)
          END=$(date +%s)
          echo "墙钟耗时 $((END-START))s"
          echo "--- 响应 ---"
          head -c 800 /tmp/up_resp.txt
          echo
          echo "$HTTP_CODE"
